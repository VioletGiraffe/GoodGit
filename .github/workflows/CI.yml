name: CI

on: [push, pull_request]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Build & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned: the AppImage runs only where glibc and libstdc++ are at least as new as the build machine's
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.*'
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        target: desktop
        # qtwayland: the Adwaita window decorations; the Wayland client itself is in qtbase
        archives: ${{ startsWith(matrix.os, 'ubuntu') && 'qtbase icu qtsvg qtwayland' || 'qtbase icu qtsvg' }}
        cache: 'true'
        #modules: 'qtimageformats'

    - name: Windows - set up MSVC environment
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # The backend tests run hg on real repositories
    - name: Windows - install Mercurial
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: |
        python -m pip install --quiet mercurial || exit /b 1
        hg --version

    - name: Windows - build tests (debug)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\build_tests.bat debug

    - name: Windows - run tests (debug)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\run_tests.bat debug

    - name: Windows - build tests (release)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\build_tests.bat

    - name: Windows - run tests (release)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: scripts\run_tests.bat

    - name: Windows - build
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: |
        %QT_ROOT_DIR%\bin\qmake.exe -v
        scripts\build_app.bat

    - name: Windows - create installer
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: |
        @echo on
        set STAGING_DIR=dist
        RMDIR /S /Q %STAGING_DIR%
        mkdir %STAGING_DIR%
        copy /y bin\release\gg.exe "%STAGING_DIR%\" >nul
        mkdir %STAGING_DIR%\lib
        copy /y bin\release\lib\gg.dll "%STAGING_DIR%\lib\" >nul
        REM The tls plugins stay: the update check talks to the GitHub API over HTTPS and fails without a backend
        %QT_ROOT_DIR%\bin\windeployqt.exe --dir %STAGING_DIR%\lib --force --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw --skip-plugin-types networkinformation %STAGING_DIR%\lib\gg.dll

        del %STAGING_DIR%\lib\dxil.dll >nul
        del %STAGING_DIR%\lib\dxcompiler.dll >nul

        "%programfiles(x86)%\Inno Setup 6\iscc" installer.iss

    - name: Windows - smoke test
      if: startsWith(matrix.os, 'windows')
      # The app's own timeout needs a running event loop: a hang at exit escapes it
      timeout-minutes: 5
      shell: cmd
      run: |
        git init -q "%RUNNER_TEMP%\smoke-repository" || exit /b 1
        echo smoke> "%RUNNER_TEMP%\smoke-repository\untracked.txt"
        dist\gg.exe --smoke-test "%RUNNER_TEMP%\smoke-repository"

    - name: Archive Installer
      if: success() && startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v7
      with:
        name: GoodGit.exe
        path: GoodGit.exe
        if-no-files-found: error

    - name: Windows - install cloc
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        winget install --id AlDanial.Cloc --exact --silent --accept-package-agreements --accept-source-agreements
        # GITHUB_PATH applies to later steps only - the metrics step is where cloc runs.
        "$env:LOCALAPPDATA\Microsoft\WinGet\Links" >> $env:GITHUB_PATH

    - name: Windows - Metrics
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        $clocOpts = '--include-lang=C,C++,C/C++ Header', '--strip-str-comments', '--json', '--quiet'
        $skipDirs = 'tests,bin,build,.git,3rdparty'

        $app = cloc @clocOpts "--exclude-dir=$skipDirs" --by-file ./app/ ./launcher/ | ConvertFrom-Json
        "GoodGit C/C++ code: $($app.SUM.code) LOC"

        # Per-file counts (everything except the 'header' and 'SUM' meta entries)
        $app.PSObject.Properties |
          Where-Object { $_.Name -notin 'header','SUM' } |
          Sort-Object { $_.Value.code } -Descending |
          ForEach-Object { "{0,6}  {1}" -f $_.Value.code, $_.Name }

        $libs = (cloc @clocOpts "--exclude-dir=$skipDirs,app,launcher" . | ConvertFrom-Json).SUM.code
        "Libs C/C++ code: $libs LOC"

        # Per-PE-section on-disk sizes from the "size of raw data" field of each SECTION HEADER.
        # dumpbin is on PATH via the earlier MSVC dev-cmd step.
        function Get-PeSectionSizes([string] $path) {
          $name = $null
          $sections = @()
          foreach ($line in (dumpbin /headers $path)) {
            if     ($line -match '^\s+(\S+) name$')                                 { $name = $Matches[1] }
            elseif ($line -match '^\s+([0-9A-Fa-f]+) size of raw data$' -and $name) {
              $sections += [pscustomobject]@{ Name = $name; KB = [math]::Round([Convert]::ToInt64($Matches[1], 16) / 1KB, 2) }
              $name = $null
            }
          }
          $sections | Sort-Object KB -Descending
        }

        $binary = Get-Item 'bin\release\lib\gg.dll'
        "{0:N2} KB  {1}" -f ($binary.Length / 1KB), $binary.Name
        Get-PeSectionSizes $binary.FullName | Format-Table Name, KB -AutoSize

    - name: Mac - install Mercurial
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install mercurial
        hg --version

    - name: Mac - build tests (debug)
      if: startsWith(matrix.os, 'macos')
      run: scripts/build_tests.sh debug

    - name: Mac - run tests (debug)
      if: startsWith(matrix.os, 'macos')
      run: scripts/run_tests.sh debug

    - name: Mac - build tests (release)
      if: startsWith(matrix.os, 'macos')
      run: scripts/build_tests.sh

    - name: Mac - run tests (release)
      if: startsWith(matrix.os, 'macos')
      run: scripts/run_tests.sh

    - name: Mac - build
      if: startsWith(matrix.os, 'macos')
      run: |
        clang --version
        scripts/build_app.sh

    - name: Mac - create DMG
      if: startsWith(matrix.os, 'macos')
      run: ./scripts/create_dmg.sh $QT_ROOT_DIR

    - name: Mac - smoke test
      if: startsWith(matrix.os, 'macos')
      timeout-minutes: 5
      run: |
        git init -q "$RUNNER_TEMP/smoke-repository"
        echo smoke > "$RUNNER_TEMP/smoke-repository/untracked.txt"
        bin/release/GoodGit.app/Contents/MacOS/gg --smoke-test "$RUNNER_TEMP/smoke-repository"

    - name: Archive DMG
      if: success() && startsWith(matrix.os, 'macos')
      uses: actions/upload-artifact@v7
      with:
        name: GoodGit.dmg
        path: GoodGit.dmg
        if-no-files-found: error

    - name: Linux - set up gcc 14
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt update -y; sudo apt install -qq gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 50
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 50
        g++ --version

    # The tests run a QApplication on the xcb platform plugin, which needs a display and libxcb-cursor0 (Qt 6.5+)
    - name: Linux - set up a virtual display
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt install -qq xvfb libxcb-cursor0

    - name: Linux - install Mercurial
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt install -qq mercurial
        hg --version

    - name: Linux - build tests (debug)
      if: startsWith(matrix.os, 'ubuntu')
      run: scripts/build_tests.sh debug

    - name: Linux - run tests (debug)
      if: startsWith(matrix.os, 'ubuntu')
      run: xvfb-run --auto-servernum scripts/run_tests.sh debug

    - name: Linux - build tests (release)
      if: startsWith(matrix.os, 'ubuntu')
      run: scripts/build_tests.sh

    - name: Linux - run tests (release)
      if: startsWith(matrix.os, 'ubuntu')
      run: xvfb-run --auto-servernum scripts/run_tests.sh

    - name: Linux - build
      if: startsWith(matrix.os, 'ubuntu')
      run: scripts/build_app.sh

    # linuxdeploy copies the libraries the Wayland platform plugin links from this machine
    - name: Linux - create AppImage
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt install -qq libwayland-client0 libwayland-cursor0 libxkbcommon0
        ./scripts/create_appimage.sh $QT_ROOT_DIR

    # The runner has no FUSE to mount the AppImage
    - name: Linux - smoke test
      if: startsWith(matrix.os, 'ubuntu')
      timeout-minutes: 5
      run: |
        git init -q "$RUNNER_TEMP/smoke-repository"
        echo smoke > "$RUNNER_TEMP/smoke-repository/untracked.txt"
        APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum ./GoodGit-*.AppImage --smoke-test "$RUNNER_TEMP/smoke-repository"

    - name: Archive AppImage
      if: success() && startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v7
      with:
        name: AppImage-${{ matrix.os }}
        path: GoodGit-*.AppImage
        if-no-files-found: error

  create-release:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # the default token is read-only; publishing a release writes to the repo
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0   # the changelog walks the history between this tag and the previous one
        fetch-tags: true

    - name: Download installer
      uses: actions/download-artifact@v8
      with:
        name: GoodGit.exe
        path: .

    - name: Download DMG
      uses: actions/download-artifact@v8
      with:
        name: GoodGit.dmg
        path: .

    - name: Download AppImages
      uses: actions/download-artifact@v8
      with:
        pattern: AppImage-*
        merge-multiple: true
        path: .

    - name: Generate changelog
      id: changelog
      run: |
        current_tag="${GITHUB_REF#refs/tags/}"
        previous_tag=$(git tag --sort=-creatordate | grep -Fxv "$current_tag" | head -1) || true
        if [ -n "$previous_tag" ]; then range="$previous_tag..$current_tag"; else range="$current_tag"; fi

        commits=$(git log "$range" --pretty=format:"- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H))")
        [ -n "$commits" ] || commits="(no commits)"

        {
          echo "body<<CHANGELOG_EOF"
          echo "$commits"
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          GoodGit.exe
          GoodGit.dmg
          GoodGit-x86_64.AppImage
          GoodGit-arm64.AppImage
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref }}
        name: ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.body }}
        draft: true   # published by hand after editing the notes and setting the pre-release flag
