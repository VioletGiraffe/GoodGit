name: CI

on: [push, pull_request]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: Build & test on ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.*
        cache: 'true'
        target: desktop

    - name: Windows - set up MSVC environment
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Windows - build
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: |
        %QT_ROOT_DIR%\bin\qmake.exe -v
        %QT_ROOT_DIR%\bin\qmake.exe -tp vc -r
        msbuild /t:Build /p:Configuration=Release || exit /b 1

    - name: Windows - create installer
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: |
        @echo on
        set STAGING_DIR=dist
        RMDIR /S /Q %STAGING_DIR%
        mkdir %STAGING_DIR%
        copy /y bin\release\gg.exe "%STAGING_DIR%\" >nul
        mkdir %STAGING_DIR%\launcher
        copy /y bin\release\launcher\gg.exe "%STAGING_DIR%\launcher\" >nul
        %QT_ROOT_DIR%\bin\windeployqt.exe --dir %STAGING_DIR% --force --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw --skip-plugin-types networkinformation --skip-plugin-types tls %STAGING_DIR%\gg.exe

        del %STAGING_DIR%\dxil.dll >nul
        del %STAGING_DIR%\dxcompiler.dll >nul

        "%programfiles(x86)%\Inno Setup 6\iscc" installer.iss

    - name: Archive Installer
      if: success() && startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: GoodGit.exe
        path: GoodGit.exe

    - name: Mac - build
      if: startsWith(matrix.os, 'macos')
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        clang --version
        $QT_ROOT_DIR/bin/qmake -r CONFIG+=release
        make -j4

    - name: Mac - create DMG
      if: startsWith(matrix.os, 'macos')
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: ./scripts/create_dmg.sh $QT_ROOT_DIR

    - name: Archive DMG
      if: success() && startsWith(matrix.os, 'macos')
      uses: actions/upload-artifact@v4
      with:
        name: GoodGit.dmg
        path: GoodGit.dmg

    - name: Linux
      if: startsWith(matrix.os, 'ubuntu')
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: |
        sudo apt update -y; sudo apt install -qq gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 50
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 50
        g++ --version

        $QT_ROOT_DIR/bin/qmake -r CONFIG+=release
        make -j4

    # - name: Test run
    #   if: startsWith(matrix.os, 'macos')
    #   run: ./tests/bin/tests.app/Contents/MacOS/tests
      
    # - name: Test run
    #   if: startsWith(matrix.os, 'ubuntu')
    #   run: ./tests/bin/tests

    # - name: Test run
    #   if: startsWith(matrix.os, 'widows')
    #   run: ./tests/bin/tests.exe
    

  create-release:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # the default token is read-only; publishing a release writes to the repo
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # the changelog walks the history between this tag and the previous one
        fetch-tags: true

    - name: Download installer
      uses: actions/download-artifact@v4
      with:
        name: GoodGit.exe
        path: .

    - name: Download DMG
      uses: actions/download-artifact@v4
      with:
        name: GoodGit.dmg
        path: .

    - name: Generate changelog
      id: changelog
      run: |
        current_tag="${GITHUB_REF#refs/tags/}"
        previous_tag=$(git tag --sort=-creatordate | grep -Fxv "$current_tag" | head -1) || true
        if [ -n "$previous_tag" ]; then range="$previous_tag..$current_tag"; else range="$current_tag"; fi

        commits=$(git log "$range" --pretty=format:"- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H))")
        [ -n "$commits" ] || commits="(no commits)"

        {
          echo "body<<CHANGELOG_EOF"
          echo "$commits"
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          GoodGit.exe
          GoodGit.dmg
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref }}
        name: ${{ github.ref_name }}
        body: ${{ steps.changelog.outputs.body }}
